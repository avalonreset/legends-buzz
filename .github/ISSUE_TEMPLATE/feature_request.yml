name: Feature request
description: Propose a new Block Buzz diagnostic, MCP-to-CLI route, or server blueprint
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or operational failure mode
      description: Which Block Buzz relay, CLI, desktop, or agent workflow does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed CLI or Python behavior
      description: Describe the preview/execute contract and expected output.
    validations:
      required: true
